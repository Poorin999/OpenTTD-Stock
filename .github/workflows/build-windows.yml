    - name: Checkout this repository
      uses: actions/checkout@v4
      with:
        path: mod
    - name: Apply the trading terminal patch
      shell: bash
      run: |
        git apply --whitespace=nowarn mod/stock-market.patch
        git status --short | head -40
    - name: Install vcpkg
      shell: bash
      run: |
        git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
        "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      env:
        VCPKG_DISABLE_METRICS: 1
    - name: Configure developer command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Build
      shell: bash
      env:
        VCPKG_BINARY_SOURCES: "clear"
      run: |
        mkdir build
        cd build
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DVCPKG_TARGET_TRIPLET=x64-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        cmake --build .
    - name: Collect files
      shell: bash
      run: |
        mkdir out
        cp build/openttd.exe out/
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: OpenTTD-15.3-StockMarket-Windows
        path: out
