name: Build OpenTTD 15.3 (Stock Market) for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest

    steps:
    # OpenTTD 15.3 goes into the root of the workspace (vcpkg looks for vcpkg.json there).
    - name: Checkout OpenTTD 15.3
      uses: actions/checkout@v4
      with:
        repository: OpenTTD/OpenTTD
        ref: '15.3'

    # This repository (holds stock-market.patch) goes into the folder "mod".
    - name: Checkout this repository
      uses: actions/checkout@v4
      with:
        path: mod

    - name: Apply the trading terminal patch
      shell: bash
      run: |
        git apply --whitespace=nowarn mod/stock-market.patch
        git status --short | head -40

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Configure developer command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build
      shell: bash
      run: |
        mkdir build
        cd build
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DVCPKG_TARGET_TRIPLET=x64-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}"
        cmake --build .

    - name: Collect files
      shell: bash
      run: |
        mkdir out
        cp build/openttd.exe out/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: OpenTTD-15.3-StockMarket-Windows
        path: out
